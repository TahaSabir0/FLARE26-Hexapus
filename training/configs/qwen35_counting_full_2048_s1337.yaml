# qwen35_counting_full_2048_s1337 -- as submitted (FLARE 2026 Task 3, Qwen3.5-9B QLoRA).
# Counting. cot prompt (system column registered), all labeled data.
# Deck: flare_final_counting_full (~1,099 rows). Effective batch 8; warmup_steps ~= 3% of total steps for this deck.
# Edit the three path fields before running.

### model
model_name_or_path: /path/to/Qwen3.5-9B
image_max_pixels: 4194304
quantization_bit: 4
quantization_method: bnb
double_quantization: false
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_target: all

### dataset
dataset: flare_final_counting_full
dataset_dir: /path/to/this-repo/training/data
template: qwen3_5
enable_thinking: false
cutoff_len: 8192
overwrite_cache: false
preprocessing_num_workers: 16
dataloader_num_workers: 8

### output
output_dir: /path/to/saves/qwen35_counting_full_2048_s1337
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
num_train_epochs: 3.0
lr_scheduler_type: linear
warmup_steps: 12
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
seed: 1337
